<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <!-- CSS only -->
<style>
  footer {
      text-align: center;
      padding: 3px;
      background-color: DodgerBlue;
      color: white;
  }

  table.fixed {
      table-layout: fixed;
  }
  table.fixed td {
      overflow: auto;
  }

</style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
<title>法律案例爬虫</title>
<link rel="icon" href="https://img.icons8.com/material-rounded/24/null/scales.png" type="image/icon type">
<link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>

</head>

<body>
    <!-- Content here -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">
            <img src="https://img.icons8.com/material-rounded/24/null/scales.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
            Law Crawler
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">首页</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/search-case">法律案例</a>
              </li>
    
              <li class="nav-item">
                <a class="nav-link disabled" href="/search-web" tabindex="-1" aria-disabled="true">搜索引擎</a>
              </li>
            </ul>
            <form class="d-flex" action="/search-web" method="POST">
                <input class="form-control me-2" type="text" placeholder="输入关键词" name="search_wd_input" aria-label="Search">
                <input class="form-control" type="number" placeholder="页数" name="search_page" aria-label="Search">
                <select class="selectpicker" name="case_chose" multiple>
                    <option value="百度" selected>百度</option>
                    <option value="搜狗">搜狗</option>
                    <option value="微信">微信</option>
                </select>
                <button class="btn btn-outline-success" type="submit" onclick="loading();">Search</button>
            </form>
          </div>
        </div>
      </nav>
    <br/>
    <h5 class="text-center mb-5">搜索引擎爬虫</h1>
    <div id="loading" style="display:none; text-align: center;"><img src="/static/loading.gif" alt="" /></div>
    <div id="content">
      {% if results %}
      <div class="alert alert-success" role="alert">
          为您找到相关结果约{{results|length}}个
      </div>
      {% endif %}
        
      <div id="result_tb"></div>
    </div>

    <!-- Footer -->
    <footer
            class="text-center text-lg-start text-dark bg-light">
  
      <!-- Section: Links  -->
      <section>
        <div class="container text-center text-md-start mt-5">
          <!-- Grid row -->
            <div class="row mt-3">
                <!-- Grid column -->
                <div class="col-md-3 col-lg-4 col-xl-3 mx-auto mb-4">
                <!-- Content -->
                    <h6 class="text-uppercase fw-bold">Dazzy DAN</h6>
                    <hr
                    class="mb-4 mt-0 d-inline-block mx-auto"
                    style="width: 60px; background-color: #2aa33f; height: 2px"
                    />
                </div>
                <!-- Grid column -->
                <!-- Grid column -->
                <div class="col-md-3 col-lg-4 col-xl-3 mx-auto mb-4">
                    <!-- Content -->
                        <h6 ><a href="https://www.github.com/Dazzydan">www.github.com/Dazzydan</a></h6>
                        <hr
                        class="mb-4 mt-0 d-inline-block mx-auto"
                        style="width: 60px; background-color: #2aa33f; height: 2px"
                        />
                    </div>
                    <!-- Grid column -->
            </div>
          <!-- Grid row -->
        </div>
      </section>
      <!-- Section: Links  -->
  
      <!-- Copyright -->
      <div
           class="text-center p-3"
           style="background-color: rgba(0, 0, 0, 0.2)"
           >
        © 2020 Copyright:
        <a class="text-dark" href="https://mdbootstrap.com/"
           >MDBootstrap.com</a
          >
      </div>
      <!-- Copyright -->
    </footer>
    <!-- Footer -->
    <script type="text/javascript">
        $(document).ready(function(){
            var checkboxes = $('.form-check-input');
            checkboxes.change(function(){
                if($('.form-check-input:checked').length>0) {
                    checkboxes.removeAttr('required');
                } else {
                    checkboxes.attr('required', 'required');
                }
            });
        });
    </script>
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script>
        new gridjs.Grid({
            columns: [
            { id: 'title', name: '标题', formatter: (cell) => gridjs.html(`<b>${cell}</b>`), width:'50%' },
            { id: 'link', name: '链接', formatter: (cell) => gridjs.html(`<a href='${cell}'>${cell}</a>`) , width:'50%'},
            ],
            data: [
                {% if results %}
                {% for link, title in results.items() %} 
                {
                    title: '{{ title }}',
                    link:  '{{ link }}',
                },
                {% endfor %}
                {% endif %}
            ],
            search: true,
            sort: true,
            pagination: true,
        }).render(document.getElementById('result_tb'));
    </script>
    <script type="text/javascript">
      function loading(){
          $("#loading").show();
          $("#content").hide();       
      }
    </script>
</body>
</html>
