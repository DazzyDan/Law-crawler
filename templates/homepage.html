<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <!-- CSS only -->
  <style>
    footer {
      text-align: center;
      padding: 3px;
      background-color: DodgerBlue;
      color: white;
    }
    
    table.fixed {
        table-layout: fixed;
    }
    table.fixed td {
        overflow: auto;
    }

    </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
  <title>法律案例爬虫</title>
  <link rel="icon" href="https://img.icons8.com/material-rounded/24/null/scales.png" type="image/icon type">
  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
</head>

<body>
    <!-- Content here -->
    <nav class="navbar navbar-dark bg-primary" >
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://img.icons8.com/material-rounded/24/null/scales.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Law Crawler
              </a>
        </div>
    </nav>
    <br/>
    <h5 class="text-center">法律案例爬虫</h1>
    <br/><br/>
    <div class="container-fluid">
        <form class="row g-3" action="/search-wd" method="POST">
            <div class="col-12">
                <label class="visually-hidden" for="autoSizingInput">问题</label>
                <input type="text" class="form-control" name="search_wd_input" placeholder="请输入需要搜索的问题" required>
            </div>
            <div class="col-md-2">
                <label class="visually-hidden" for="autoSizingInput">页数</label>
                <input type="number" class="form-control" name="search_page" placeholder="页数" required>
            </div>
            <div class="col-md-2 form-check">
                <input type="checkbox" id="checkboxes" class="form-check-input" value="baidu" name = "search_method" required>
                <label class="form-check-label" for="exampleCheck1">百度</label>
            </div>
            <div class="col-md-2 form-check">
                <input type="checkbox" id="checkboxes" class="form-check-input" value="sogou" name = "search_method" required>
                <label class="form-check-label" for="exampleCheck1">搜狗</label>
            </div>
            <div class="col-md-2 form-check">
                <input type="checkbox" id="checkboxes" class="form-check-input" value="wechat" name = "search_method" required>
                <label class="form-check-label" for="exampleCheck1">微信</label>
            </div>
            <button type="submit" class="col-md-2 btn btn-primary">搜索</button>
        </form>
    </div>
    <br/><br/>
    {% if results %}
    <div class="alert alert-success" role="alert">
        为您找到相关结果约{{results|length}}个
    </div>
    {% endif %}
    
    <table class="table table-hover table-bordered vertical-align: middle fixed">
        <thead class="table-light">
            <col style="width: 2%;" />
            <col style="width: 49%;" />
            <col style="width: 49%;" />

        <tr>
            <th scope="col" class="text-center">#</th>
            <th scope="col" class="text-center">标题</th>
            <th scope="col" class="text-left">链接</th>
        </tr>
        </thead>
        <tbody>
        {% if results %}
        {% for link, title in results.items() %}
        <tr>
            <th scope="row">{{loop.index}}</th>
            <td class="text-center">{{title}}</td>
            <td class="text-left"><a href= {{link}}>{{link}}</a></td>
        </tr>
        {% endfor %}
        {% else %}
        <tr>
            <td colspan="3" class="text-center">搜寻结果为0</td>
        </tr>
        {% endif %}
        </tbody>
    </table>    
    <footer>
        <p>Qiudan WANG</p>
        <p><a href="https://www.github.com/Dazzydan">www.github.com/Dazzydan</a></p>
    </footer>
    <script type="text/javascript">
        $(document).ready(function(){
            var checkboxes = $('.form-check-input');
            checkboxes.change(function(){
                if($('.form-check-input:checked').length>0) {
                    checkboxes.removeAttr('required');
                } else {
                    checkboxes.attr('required', 'required');
                }
            });
        });
    </script>
</body>
</html>
