<!doctype html>
<html lang="zh">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
    <style>
        .search-bar {
            background-image: linear-gradient( rgba(0,0,0,0.2), rgba(0, 0, 0, 0.5) ),url('/static/background.jpeg');
            background-repeat: no-repeat;
            background-position: center;
            -webkit-background-size: 100%;
            background-size: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center
        }
        
        .search {
            background-color: #fff;
            padding: 4px;
            border-radius: 5px
        }
        
        .search-1 {
            position: relative;
            width: 100%
        }
        
        .search-1 input {
            height: 45px;
            border: none;
            width: 100%;
            padding-left: 34px;
            padding-right: 10px;
            border-right: 2px solid #eee
        }
        
        .search-1 input:focus {
            border-color: none;
            box-shadow: none;
            outline: none
        }
        
        .search-1 i {
            position: absolute;
            top: 12px;
            left: 5px;
            font-size: 24px;
            color: #eee
        }
        
        ::placeholder {
            color: grey;
            opacity: 1
        }
        
        .search-2 {
            position: relative;
            width: 100%
        }
        
        .search-select {
            height: 45px;
            border: none;
            width: 100%;
            padding-left: 18px;
            padding-right: 100px
        }
        
        .search-select:focus {
            border-color: none;
            box-shadow: none;
            outline: none
        }
        
        
        .search-btn {
            position: absolute;
            right: 1px;
            top: 0px;
            
            height: 45px;
            
            width: 90px;
            border-radius: 4px
        }
        .nav-tabs > li.active > button {
            color: #3c5a78;
            font-size: 16px;
            margin-left:50px;
            margin-right:40px;
          }

          .nav-tabs > li > button {
            color: #fff;
            margin-left:50px;
            margin-right:40px;
          }
        
        
        @media (max-width:800px) {
            .search-1 input {
                border-right: none;
                border-bottom: 1px solid #eee
            }
        
            .search-2 select {
                padding-left: 34px
            }
        
            .search-2 button {
                height: 37px;
                top: 5px
            }
        }
    </style>
    <title>法律爬虫</title>
    <link rel="icon" href="https://img.icons8.com/material-rounded/24/null/scales.png" type="image/icon type">
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.1/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>


  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">
            <img src="https://img.icons8.com/material-rounded/24/null/scales.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
            Law Crawler
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">首页</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/search-web">搜索引擎</a>
              </li>
    
              <li class="nav-item">
                <a class="nav-link" href="/search-case" tabindex="-1">法律案例</a>
              </li>
            </ul>
          </div>
        </div>
    </nav>
    <div id="loading" style="display:none; text-align: center;"><img src="/static/loading.gif" alt="" /></div>
    <!-- Navbar -->
    
    <!-- Search bar -->
    <div class="search-bar" id="content">
            <div class="container">
                <!-- Search bar nav-->
                <ul class="nav nav-tabs justify-content-center" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                      <button class="nav-link active" id="web-tab" data-bs-toggle="tab" data-bs-target="#web" type="button" role="tab" aria-controls="web" aria-selected="true">搜索引擎搜索</button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button class="nav-link" id="case-tab" data-bs-toggle="tab" data-bs-target="#case" type="button" role="tab" aria-controls="case" aria-selected="false">案例搜索</button>
                    </li>
                </ul> 
                <!--Search bar nav-->
                <div class="search"> 
                    
                    <div class="tab-content" id="myTabContent">
                        <div class="tab-pane fade show active" id="web" role="tabpanel" aria-labelledby="web-tab">
                            <form action="/search-web" method="POST">
                                <div class="row"> 
                                    <div class="col-md-6"> 
                                        <div class="search-1"> 
                                            <i class='bx bx-search-alt'></i> 
                                            <input type="text" placeholder="请输入关键词" name="search_wd_input" required> 
                                        </div> 
                                    </div> 
                                    <div class="col-md-2"> 
                                        <div> 
                                            <div class="search-1"> 
                                                <input type="number" class="form-control" name="search_page" placeholder="页数" required>
                                            </div> 
                                        </div> 
                                    </div> 
                                    <div class="col-md-4"> 
                                        <div> 
                                            <div class="search-2"> 
                                                <select class="selectpicker search-select" name="case_chose" multiple data-width="75%">
                                                    <option value="百度" selected>百度</option>
                                                    <option value="搜狗">搜狗</option>
                                                    <option value="微信">微信</option>
                                                </select>
                                                <button type="submit" class="search-btn btn btn-secondary" onclick="loading();">搜索</button> 
                                            </div> 
                                        </div> 
                                    </div> 
                                </div>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="case" role="tabpanel" aria-labelledby="case-tab">
                            <form action="/search-case" method="POST">
                                <div class="row"> 
                                    <div class="col-md-6"> 
                                        <div class="search-1"> 
                                            <i class='bx bx-search-alt'></i> 
                                            <input type="text" placeholder="请输入关键词" name="search_wd_input" required> 
                                        </div> 
                                    </div>
                                    <div class="col-md-2"> 
                                        <div> 
                                            <div class="search-1"> 
                                                <input type="number" class="form-control" name="search_page" placeholder="页数" required>
                                            </div> 
                                        </div> 
                                    </div> 
                                    <div class="col-md-4"> 
                                        <div> 
                                            <div class="search-2"> 
                                                <select class="selectpicker search-select" name="case_chose" multiple data-width="75%">
                                                    <option value="权威案例" selected>权威案例</option>
                                                    <option value="高院案例">高院案例</option>
                                                    <option value="普通案例">普通案例</option>
                                                </select>
                                                <button type="submit" class="search-btn btn btn-secondary" onclick="loading();">搜索</button> 
                                            </div> 
                                        </div> 
                                    </div> 
                                </div>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">...</div>
                    </div>
                    
                     
                </div>
            </div>
        
    </div>
    
    <!-- Search bar -->

    <!-- Footer -->
    <footer class="text-center text-lg-start text-dark bg-light">
      <!-- Section: Links  -->
      <section class="">
        <div class="container text-center text-md-start mt-5">
          <!-- Grid row -->
            <div class="row mt-3">
                <!-- Grid column -->
                <div class="col-md-3 col-lg-4 col-xl-3 mx-auto mb-4">
                <!-- Content -->
                    <h6 class="text-uppercase fw-bold">Dazzy DAN</h6>
                    <hr
                    class="mb-4 mt-0 d-inline-block mx-auto"
                    style="width: 60px; background-color: #2aa33f; height: 2px"
                    />
                </div>
                <!-- Grid column -->
                <!-- Grid column -->
                <div class="col-md-3 col-lg-4 col-xl-3 mx-auto mb-4">
                    <!-- Content -->
                        <h6 ><a href="https://www.github.com/Dazzydan">www.github.com/Dazzydan</a></h6>
                        <hr
                        class="mb-4 mt-0 d-inline-block mx-auto"
                        style="width: 60px; background-color: #2aa33f; height: 2px"
                        />
                    </div>
                    <!-- Grid column -->
            </div>
          <!-- Grid row -->
        </div>
      </section>
      <!-- Section: Links  -->
  
      <!-- Copyright -->
      <div
           class="text-center p-3"
           style="background-color: rgba(0, 0, 0, 0.2)"
           >
        © 2020 Copyright:
        <a class="text-dark" href="https://mdbootstrap.com/"
           >MDBootstrap.com</a
          >
      </div>
      <!-- Copyright -->
    </footer>
    <!-- Footer -->
    <script type="text/javascript">
        function loading(){
            $("#loading").show();
            $("#content").hide();       
        }
    </script>
  </body>
</html>
