<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <!-- CSS only -->
  <style>
    footer {
      text-align: center;
      padding: 3px;
      background-color: DodgerBlue;
      color: white;
    }
    
    table.fixed {
        table-layout: fixed;
    }
    table.fixed td {
        overflow: auto;
    }

    </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
  <title>法律案例爬虫</title>
  <link rel="icon" href="https://img.icons8.com/material-rounded/24/null/scales.png" type="image/icon type">
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
</head>

<body>
    <!-- Content here -->
    <nav class="navbar navbar-dark bg-primary" >
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://img.icons8.com/material-rounded/24/null/scales.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Law Crawler
              </a>
        </div>
    </nav>
    <br/>
    <h5 class="text-center">法律案例爬虫</h1>
    <br/><br/>
    <div class="container-fluid">
        <form class="row g-3" action="/search-case" method="POST">
            <div class="col-12">
                <label class="visually-hidden" for="autoSizingInput">问题</label>
                <input type="text" class="form-control" name="search_wd_input" placeholder="请输入需要搜索的问题" required>
            </div>
            <div class="col-md-2">
                <label class="visually-hidden" for="autoSizingInput">页数</label>
                <input type="number" class="form-control" name="search_page" placeholder="页数" required>
            </div>
            <select class="col-md-2 custom-select custom-select-lg " name="case_chose">
                <option selected value="权威案例">权威案例</option>
                <option value="高院案例">高院案例</option>
                <option value="普通案例">普通案例</option>
            </select>
            <button type="submit" class="col-md-2 btn btn-primary">搜索</button>
        </form>
    </div>
    <br/><br/>
    {% if results %}
    <div class="alert alert-success" role="alert">
        为您找到相关结果约{{results|length}}个
    </div>
    {% endif %}
     
    <div id="result_tb"></div>
    <footer>
        <p>Qiudan WANG</p>
        <p><a href="https://www.github.com/Dazzydan">www.github.com/Dazzydan</a></p>
    </footer>
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script>
        new gridjs.Grid({
            columns: [
            { id: 'title', name: '案由', formatter: (cell) => gridjs.html(`<b>${cell}</b>`), width:'30%' },
            { id: 'court', name: '审理法院'},
            { id: 'case_num', name: '案号'},
            { id: 'case_type', name: '文书类型'},
            { id: 'procedure', name: '审理程序'},
            { id: 'ref', name: '参考类型'},
            { id: 'date', name: '裁判日期'},
            { id: 'legal', name: '法律依据', width:'30%'},
            { id: 'lawsuit', name: '诉讼请求', width:'30%'},
            { id: 'trial', name: '审理经过', width:'30%'},
            { id: 'result', name: '裁判结果', width:'30%'},
            { id: 'judges', name: '审判人员'},
            ],
            data: [
                {% if results %}
                {% for result in results %} 
                {
                    title: '{{ result["案由"] }}',
                    court:  '{{ result["审理法院"] }}',
                    case_num: '{{ result["案号"] }}',
                    case_type:  '{{ result["案件类型"] }}',
                    procedure: '{{ result["审理程序"] }}',
                    ref:  '{{ result["参考类型"] }}',
                    date: '{{ result["裁判日期"] }}',
                    {% if "法律依据" in result.keys() %}
                    legal:  '{{ result["法律依据"] }}',
                    {% else %}
                    legal: ' ',
                    {% endif %}
                    {% if "诉讼请求" in result.keys() %}
                    lawsuit: '{{ result["诉讼请求"] }}',
                    {% else %}
                    lawsuit: ' ',
                    {% endif %}
                    trail:  '{{ result["审理经过"] }}',
                    result: '{{ result["裁判结果"] }}',
                    judges:  '{{ result["审判人员"] }}',
                },
                {% endfor %}
                {% endif %}
            ],
            search: true,
            sort: true,
            pagination: true,
        }).render(document.getElementById('result_tb'));
    </script>
</body>
</html>
